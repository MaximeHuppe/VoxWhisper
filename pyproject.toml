[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voxwhisper"
version = "0.1.0"
description = "3D multi-modal, language-grounded volumetric segmentation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "nibabel>=5.0",
    "numpy>=1.22",
    "transformers>=4.30",
    "monai>=1.3",
    "wandb>=0.17",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "scipy>=1.8",
    "dipy>=1.7",
    "SimpleITK>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["voxwhisper*", "scripts*"]
