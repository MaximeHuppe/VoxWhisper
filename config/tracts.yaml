# tracts.yaml — white-matter tract segmentation (6 structures)

data:
  paths:
    raw: data/raw
    processed: data/processed_T1_FA
    cache: cache                 # shared artifacts (prompt embeddings)
    runs: runs                   # training outputs: runs/{processed_leaf}/{run_name}/{timestamp}/

  modalities:
    primary: t1
    secondary: fa

  volumes:
    t1:
      filename: T1w_acpc_dc_restore_1.25.nii.gz
    t2:
      filename: T2w_acpc_dc_restore.nii.gz
    b0:
      filename: average_b0.nii.gz
    fa:
      filename: dti_FA.nii.gz

  masks:
    source: tract_masks_1.25
    structures: config/structures.json

  download:
    modalities: ["diffusion"] # Or ["t1", "t2", "diffusion"]
    bucket: "hcp-openaccess"
    dataset_prefix: "HCP_1200"

  patch:
    size: [128, 128, 128]
    positive_ratio: 0.5
    train_patches_per_subject: 4
    val_patches_per_subject: 4

  mock_volume_shape: [192, 192, 192]

preprocessing:
  normalization: zscore
  zscore_nonzero_only: true

text_encoder:
  model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  cache_file: prompts_tracts.pt

model:
  input_channels: 1          # primary encoder
  secondary_encoder:
    input_channels: 1        # falls back to model.input_channels if omitted

  text_dim: 768
  embed_dim: 128
  num_heads: 4
  encoder:
    channels: [16, 32, 64, 128]
    strides: [2, 2, 2]
    kernel_sizes: [3, 3, 3]
    paddings: [1, 1, 1]
    num_resblocks: [1, 1, 1]
  
training:
  run_name: baseline         # folder under runs/{processed_leaf}/; override with --name
  seed: 42
  batch_size: 2
  effective_batch_size: 8    # 8 or 16; must be a multiple of batch_size (accum = this / batch_size)
  epochs: 150
  learning_rate: 0.00005
  warmup_epochs: 10             # linear LR warmup; 0 = disabled
  bce_pos_weight: 20         # foreground BCE weight; background stays 1
  dice_weight: 1.0
  bce_weight: 0.5
  deep_supervision_weights: [0.1, 0.3, 0.6]
  checkpoint:
    monitor: dice          # loss | dice
    dice_scope: patch      # patch | volume (only if monitor=dice)
    keep: 3                # top-k by monitor (highest dice / lowest loss)
    every: 10              # write vox_whisper_epoch_N.pt every N epochs
    volume_every: 5       # full-volume Dice every N epochs (dice_scope=volume)
    keep_periodic: false
  dataloader:
    shuffle: true
    drop_last: true
    num_workers: 8
    pin_memory: true

splits:
  enabled: true
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  manifest: data/splits.json

logging:
  # Backend for experiment tracking.  Options: none | tensorboard | wandb
  backend: none
  tensorboard:
    # Defaults to <run_dir>/tb_logs/ when null.  Run: tensorboard --logdir runs/
    log_dir: null
  wandb:
    project: voxwhisper
    entity: imag2
    tags: []

inference:
  overlap: 0.5
  mode: gaussian
  sigma_scale: 0.125
  sw_batch_size: 2
  split: test
  output_dir: data/predictions
  checkpoint: null
  threshold: 0.5
  save_probabilities: false
  progress: true
