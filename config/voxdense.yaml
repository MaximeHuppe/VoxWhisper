# =============================================================================
# voxdense.yaml — Phase 1 T1 dense-structure pretraining
#
# Train VoxDense (single T1 encoder + name prompts) on HCP FreeSurfer labels
# collapsed to a SynthSeg/OpenMind ~32-tissue set.
# Phase 2 (nerves + FA + LLM) uses a separate config/voxwhisper.yaml later.
# =============================================================================

# ── Data ─────────────────────────────────────────────────────────────────────

data:
  paths:
    raw:       /home/imag2/Documents/IMAG2/HCP
    processed: data/processed_dense
    cache:     cache
    runs:      runs

  volumes:
    t1:
      filename: T1w_acpc_dc_restore_1.25.nii.gz
    brainmask:
      filename: brainmask_fs.nii.gz
    wmparc:
      filename: wmparc.nii.gz

  masks:
    structures: config/structures_dense.json

  nerve_masks:
    root:   data/raw
    source: tract_masks_1.25

  patch:
    size:                      [128, 128, 128]
    positive_ratio:            0.7
    train_patches_per_subject: 8
    val_patches_per_subject:   4
    prompts_per_crop:          8

# ── Pre-processing ────────────────────────────────────────────────────────────

preprocessing:
  zscore_nonzero_only: true
  apply_brainmask:     true

# ── Text encoder (frozen) ─────────────────────────────────────────────────────

text_encoder:
  model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  cache_file: prompts_dense.pt

# ── Model architecture ────────────────────────────────────────────────────────

model:
  name: VoxDense
  input_channels: 1
  text_dim:   768
  embed_dim:  256
  num_heads:  4

  encoder:
    channels:      [32, 64, 128, 256]
    strides:       [2, 2, 2]
    kernel_sizes:  [3, 3, 3]
    paddings:      [1, 1, 1]
    num_resblocks: [1, 1, 1]

# ── Training ──────────────────────────────────────────────────────────────────

training:
  run_name: voxdense
  seed:     42

  batch_size:      2
  epochs:         150
  learning_rate:  0.0001
  warmup_epochs:    5

  bce_weight:     0.5
  exclude_background: true
  deep_supervision_weights: [0.1, 0.3, 0.6]

  checkpoint:
    monitor: dice
    keep:    3
    every:   10

  dataloader:
    shuffle:      true
    drop_last:    true
    num_workers:  8
    pin_memory:   true

# ── Data splits ───────────────────────────────────────────────────────────────

splits:
  train_ratio: 0.8
  val_ratio:   0.1
  test_ratio:  0.1
  seed:        42
  manifest:    data/splits.json
  subject_split: config/subject_split.json

# ── Experiment tracking ───────────────────────────────────────────────────────

logging:
  backend: wandb
  wandb:
    project: voxwhisper
    entity:  null
    tags:    [voxdense, phase1]

# ── Inference / evaluation ────────────────────────────────────────────────────

inference:
  overlap:            0.5
  mode:               gaussian
  sigma_scale:        0.125
  sw_batch_size:      2
  split:              test
  output_dir:         data/predictions
  checkpoint:         null
  threshold:          0.5
  save_probabilities: false
  progress:           true
