# default.yaml — single source of truth for VoxWhisper

data:
  paths:
    raw_masks: data/raw_masks
    raw: data/raw
    processed: data/processed
    cache: cache

  # Active modalities for this experiment
  modalities:
    primary: t1          # anchor coordinate space (decoder output resolution)
    secondary: t2        # cross-volume fusion partner (replaces diffusion)

  volumes:
    t1:
      filename: T1w_acpc_dc_restore.nii.gz
    t2:
      filename: T2w_acpc_dc_restore.nii.gz

  masks:
    filename: "{subject_id}_label.nii.gz"

  # On-the-fly training patches (full volumes are stored; crops happen in Dataset)
  patch:
    size: [128, 128, 128]
    positive_ratio: 0.5          # 50% positive (nerve-centered) / 50% random
    positive_labels: [1]         # OpticNerveSeg: 1 = optic nerve
    # validation / test: deterministic center crop of ``size``

  # Shape used only by generate_mock_dataset.py (must be >= patch.size)
  mock_volume_shape: [192, 192, 192]

  prompts:
    - background
    - optic nerve
    - optic chiasm

  download:
    bucket: hcp-openaccess
    dataset_prefix: HCP_1200
    modalities: [t1, t2]       # diffusion excluded for now
    limit_subjects: false
    limit_count: 10

preprocessing:
  normalization: zscore        # minmax | zscore (applied to full volume)
  zscore_nonzero_only: true    # compute stats on non-air voxels

text_encoder:
  model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  cache_file: prompts_cn2.pt

model:
  input_channels: 1
  text_dim: 768
  embed_dim: 128
  num_heads: 4
  encoder:
    channels: [16, 32, 64, 128]
    strides: [2, 2, 2]
    kernel_sizes: [3, 3, 3]
    paddings: [1, 1, 1]
    num_resblocks: [1, 1, 1]

training:
  batch_size: 2
  epochs: 150
  learning_rate: 0.00005
  deep_supervision_weights: [0.1, 0.3, 0.6]
  checkpoint_every: 10
  dataloader:
    shuffle: true
    drop_last: true
    num_workers: 0
    pin_memory: false

splits:
  enabled: true
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  manifest: data/splits.json

# Full-volume evaluation (see evaluate.py). Training still uses patch crops.
inference:
  overlap: 0.5                 # 50% window overlap for Gaussian blending
  mode: gaussian               # down-weight patch borders (seam artifacts)
  sigma_scale: 0.125           # MONAI Gaussian sigma as a fraction of roi_size
  sw_batch_size: 2             # patches processed concurrently on the GPU
  split: test                  # default split when --split is omitted
  output_dir: data/predictions
  checkpoint: null             # null → latest cache/vox_whisper_epoch_*.pt
  threshold: 0.5               # sigmoid cutoff for per-channel Dice
  save_probabilities: false    # also write 4D (D,H,W,C) probability NIfTIs
  progress: true
